<!-- heading -->
{{- $heading := .Get 0 -}}
{{- $headingKey := printf "%s_heading" $heading -}}
{{- $text := T $headingKey -}}

{{- $anchor := index site.Data.anchors $heading -}}
{{- if $anchor -}}
    {{ printf "%s {#%s}" $text $anchor | safeHTML }}
{{- else -}}
    {{ $text | safeHTML }}
{{- end -}}
